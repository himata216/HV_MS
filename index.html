<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
<meta name="theme-color" content="#050607">
<title>竣工VERSUS 重機</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050607; color: #e7e5df; }
body { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; overscroll-behavior: none; }
#unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #050607; outline: none; }
#hmb-load { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #050607; transition: opacity .4s; }
#hmb-load.done { opacity: 0; pointer-events: none; }
#hmb-load img { width: min(560px, 76vw); height: auto; filter: drop-shadow(3px 4px 0 rgba(0,0,0,.7)); }
#hmb-load .s { font-size: 12px; letter-spacing: .5em; color: #9aa0a8; }
#hmb-bar { width: min(420px, 70vw); height: 10px; background: #1b1e23; border: 1px solid #3a3f47; transform: skewX(-18deg); overflow: hidden; }
#hmb-bar i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(-45deg, #f2b01e 0 12px, #d99a12 12px 24px); transition: width .2s; }
#hmb-pct { font-size: 13px; color: #9aa0a8; letter-spacing: .2em; font-variant-numeric: tabular-nums; }
#hmb-msg { position: fixed; left: 0; right: 0; top: 0; padding: 10px 16px; font-size: 14px; display: none; z-index: 5; }
#hmb-msg.warn { display: block; background: #f2b01e; color: #15130c; }
#hmb-msg.err { display: block; background: #b3261e; color: #fff; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="hmb-load">
  <img src="logo.png" alt="竣工VERSUS：重機">
  <div class="s">5VS5 BUILD BATTLE</div>
  <div id="hmb-bar"><i></i></div>
  <div id="hmb-pct">LOADING 0%</div>
</div>
<div id="hmb-msg"></div>
<script>
var canvas = document.querySelector("#unity-canvas");
var load = document.querySelector("#hmb-load");
var bar = document.querySelector("#hmb-bar i");
var pct = document.querySelector("#hmb-pct");
var msg = document.querySelector("#hmb-msg");
function unityShowBanner(m, type) {
  if (type == 'error') { msg.className = 'err'; msg.textContent = m; return; }
  if (type == 'warning') { msg.className = 'warn'; msg.textContent = m; setTimeout(function () { msg.className = ''; }, 5000); }
}
var buildUrl = ".";   // ファイルはすべて index.html と同じ場所
var loaderUrl = buildUrl + "/WebGL.loader.js";
var config = {
  dataUrl: buildUrl + "/WebGL.data.unityweb",
  frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
  codeUrl: buildUrl + "/WebGL.wasm.unityweb",
  streamingAssetsUrl: ".",
  companyName: "HEAVY_MS",
  productName: "竣工VERSUS 重機",
  productVersion: "1.0",
  showBanner: unityShowBanner,
  // 高精細なスマホで重くなりすぎないよう、描画の細かさは最大 2 倍まで
  devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
};
var script = document.createElement("script");
script.src = loaderUrl;
script.onload = function () {
  createUnityInstance(canvas, config, function (p) {
    var n = Math.round(p * 100); bar.style.width = n + "%"; pct.textContent = "LOADING " + n + "%";
  }).then(function (inst) {
    window.unityInstance = inst;
    load.classList.add("done"); setTimeout(function () { load.style.display = "none"; }, 500);
    canvas.focus();
  }).catch(function (e) { unityShowBanner(String(e), 'error'); });
};
document.body.appendChild(script);
// キーボードの操作がいつもゲームに届くように
canvas.addEventListener("pointerdown", function () { canvas.focus(); });
window.addEventListener("contextmenu", function (e) { e.preventDefault(); });
</script>
</body>
</html>
